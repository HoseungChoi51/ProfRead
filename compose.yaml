services:
  co-reader:
    build: .
    restart: unless-stopped
    init: true
    environment:
      CO_READER_PASSWORD: ${CO_READER_PASSWORD:?set CO_READER_PASSWORD}
      CO_READER_SESSION_SECRET: ${CO_READER_SESSION_SECRET:?set CO_READER_SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - co-reader-data:/data
    ports:
      - "127.0.0.1:4310:4310"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  co-reader-data:
    name: co-reader-data
