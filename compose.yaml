services:
  afterdraft:
    build: .
    restart: unless-stopped
    init: true
    environment:
      AFTERDRAFT_PASSWORD: ${AFTERDRAFT_PASSWORD:?set AFTERDRAFT_PASSWORD}
      AFTERDRAFT_SESSION_SECRET: ${AFTERDRAFT_SESSION_SECRET:?set AFTERDRAFT_SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - afterdraft-data:/data
    ports:
      - "127.0.0.1:4310:4310"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  afterdraft-data:
    name: afterdraft-data
